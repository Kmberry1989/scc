<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touchy Subjects LLC - Production Pipeline</title>
    <style>
        :root {
            --bg-color: #1a1a1f;
            --panel-bg: #22222a;
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
            --accent: #d84b7b; /* Touchy Subjects Brand Accent */
            --accent-hover: #b83a60;
            --border: #333340;
            --panel-width: 450px;
        }

        body {
            margin: 0; padding: 0; display: flex; height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-main); overflow: hidden;
        }

        #sidebar {
            width: var(--panel-width); background-color: var(--panel-bg);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 2px 0 15px rgba(0,0,0,0.5); z-index: 10;
        }

        .panel-header { padding: 15px 20px; background-color: #17171d; border-bottom: 1px solid var(--border); }
        .panel-header h1 { margin: 0; font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; }
        .panel-header p { margin: 2px 0 0 0; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .panel-content { padding: 20px; overflow-y: auto; flex-grow: 1; }

        .section-title {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); margin: 20px 0 10px 0; border-bottom: 1px solid var(--border); padding-bottom: 5px;
        }
        .section-title:first-child { margin-top: 0; }

        .control-group { margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.8rem; font-weight: 600; color: #d0d0df; }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%; padding: 8px 10px; background-color: #131318; border: 1px solid var(--border);
            color: var(--text-main); border-radius: 4px; font-family: monospace; box-sizing: border-box; font-size: 0.85rem;
        }
        textarea { resize: vertical; min-height: 60px; color: #a4b4ff; }
        select { cursor: pointer; font-family: inherit; }
        input[type="range"] { width: 100%; margin: 5px 0; cursor: pointer; accent-color: var(--accent); }

        button {
            width: 100%; padding: 10px; background-color: var(--accent); color: white; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.85rem;
        }
        button:hover { background-color: var(--accent-hover); }
        button.secondary { background-color: #2a2a35; border: 1px solid var(--border); color: var(--text-main); }
        button.secondary:hover { background-color: #353545; }
        button.action { background-color: #4a90e2; }
        button.action:hover { background-color: #357abd; }

        #canvas-container { flex-grow: 1; position: relative; background: radial-gradient(circle at center, #252530 0%, #101015 100%); }
        #loading-msg, #error-msg {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 8px 16px; border-radius: 4px; display: none; z-index: 20; font-weight: bold; font-size: 0.9rem;
        }
        #error-msg { background-color: rgba(255, 74, 74, 0.9); color: white; }
        #loading-msg { background-color: rgba(74, 144, 226, 0.9); color: white; display: block; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="sidebar">
        <div class="panel-header">
            <h1>TOUCHY SUBJECTS LLC</h1>
            <p>Sensory Production Pipeline</p>
        </div>
        <div class="panel-content">
            
            <div class="section-title">1. Standardized Format</div>
            <div class="control-group">
                <select id="format-select">
                    <option value="card">Standard Card (63x88mm)</option>
                    <option value="coin">Sensory Coin (Ø50mm)</option>
                    <option value="stone">Worry Stone (60x80mm Oval)</option>
                </select>
            </div>

            <div class="section-title">2. Tactile Generator</div>
            <button id="btn-gacha" class="secondary">🎲 Randomize (Gacha Mechanics)</button>
            
            <div class="control-group">
                <label>Base Pattern (Macro)</label>
                <select id="base-select"></select>
            </div>
            <div class="control-group">
                <label>Micro Detail (Texture)</label>
                <select id="micro-select"></select>
            </div>

            <div class="control-group grid-2">
                <div>
                    <label>Intensity <span id="intensity-val">0.5</span></label>
                    <input type="range" id="intensity" min="0" max="3" step="0.05" value="0.8">
                </div>
                <div>
                    <label>Rotation <span id="rotation-val">45°</span></label>
                    <input type="range" id="rotation" min="0" max="360" step="5" value="45">
                </div>
            </div>

            <div class="control-group" style="display:none;">
                <label>Z = f(x, y) Core Logic</label>
                <textarea id="equation-input"></textarea>
            </div>

            <div class="section-title">3. Branding & Export</div>
            <div class="control-group">
                <label>Edition Name (Embossed on back)</label>
                <input type="text" id="edition-name" value="Series 1 Proto">
            </div>

            <button id="btn-render">Refresh Preview</button>
            <button id="btn-export" class="action">💾 Export Solid Collectible (.STL)</button>
            <button id="btn-export-box" class="secondary">📦 Export Vase-Mode Slipcase (.STL)</button>
        </div>
    </div>

    <div id="canvas-container">
        <div id="loading-msg">Loading Fonts & Systems...</div>
        <div id="error-msg">Invalid Geometry Logic</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

        // --- Data Banks ---
        const basePatterns = [
            { title: 'Flat (Texture Only)', eq: '0' },
            { title: 'Gentle Rolling Waves', eq: 'Math.sin(x/2) + Math.cos(y/2)' },
            { title: 'Macro Dimples', eq: '-(Math.pow(Math.cos(x/2), 2) + Math.pow(Math.cos(y/2), 2))' },
            { title: 'Terrain Hills', eq: 'Math.sin(x/2) + 0.5 * Math.sin(y)' },
            { title: 'Saddle Curve', eq: '(x*x - y*y) / 15' },
            { title: 'Pyramid Steps', eq: 'Math.floor(x/2) + Math.floor(y/2)' }
        ];

        const microTextures = [
            { title: 'Diamond Knurling', eq: 'Math.abs(Math.sin(x*4)) + Math.abs(Math.cos(y*4))' },
            { title: 'Waffle Grid', eq: 'Math.cos(x*4) + Math.cos(y*4) + Math.cos((x+y)*4)' },
            { title: 'Crystalline Thorns', eq: 'Math.sqrt(Math.abs(Math.sin(x*4) * Math.cos(y*4)))' },
            { title: 'Glitch Mapping', eq: 'Math.floor(Math.sin(x*5) * 3)/3 + Math.floor(Math.cos(y*5) * 3)/3' },
            { title: 'Directional Grain', eq: 'Math.sin(x*8 + Math.sin(y*2))' },
            { title: 'Bubble Wrap Domes', eq: 'Math.pow(Math.sin(x*3) * Math.sin(y*3), 2)' },
            { title: 'Smooth Ripple', eq: 'Math.sin(Math.sqrt(x*x + y*y)*3)' }
        ];

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, -60, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(20, -20, 40);
        scene.add(dirLight);

        // Standard PLA/Silk Material
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xd84b7b, roughness: 0.3, metalness: 0.2 
        });

        let currentMesh = null;
        let loadedFont = null;

        // Load Font for Branding
        const loader = new FontLoader();
        loader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            loadedFont = font;
            document.getElementById('loading-msg').style.display = 'none';
            initUI();
        });

        // --- Core Generator ---
        function generateSurface() {
            if (!loadedFont) return;
            const errorMsg = document.getElementById('error-msg');
            const format = document.getElementById('format-select').value;
            const editionName = document.getElementById('edition-name').value;
            const eqStr = document.getElementById('equation-input').value;

            if (currentMesh) scene.remove(currentMesh);

            try {
                const zFunc = new Function('x', 'y', 'return ' + eqStr + ';');
                zFunc(0,0); // Test
                errorMsg.style.display = 'none';

                let baseGeo, width, height, marginX, marginY;
                const thickness = 3; 
                const margin = 4; // 4mm smooth border

                // 1. Generate Base Format Geometry
                if (format === 'card') {
                    width = 63; height = 88;
                    baseGeo = new THREE.BoxGeometry(width, height, thickness, 100, 100, 1);
                    marginX = (width/2) - margin; marginY = (height/2) - margin;
                } else if (format === 'coin') {
                    width = 50; height = 50;
                    baseGeo = new THREE.CylinderGeometry(25, 25, thickness, 120, 1);
                    baseGeo.rotateX(Math.PI / 2); // Align Z up
                } else if (format === 'stone') {
                    width = 60; height = 80;
                    baseGeo = new THREE.CylinderGeometry(30, 30, thickness, 120, 1);
                    baseGeo.scale(1, 1, 80/60); // Squash into oval
                    baseGeo.rotateX(Math.PI / 2);
                }

                // 2. Apply Tactile Math to Top Face
                const positions = baseGeo.attributes.position;
                for (let i = 0; i < positions.count; i++) {
                    const x = positions.getX(i);
                    const y = positions.getY(i);
                    const z = positions.getZ(i);

                    // If vertex is on the top face (Z > 0)
                    if (z > 1) {
                        let applyTexture = false;
                        
                        if (format === 'card') {
                            if (Math.abs(x) < marginX && Math.abs(y) < marginY) applyTexture = true;
                        } else if (format === 'coin') {
                            const dist = Math.sqrt(x*x + y*y);
                            if (dist < 25 - margin) applyTexture = true;
                        } else if (format === 'stone') {
                            // Normalized distance for ellipse
                            const nx = x / 30; const ny = y / 40;
                            const dist = Math.sqrt(nx*nx + ny*ny);
                            // Approx margin calculation for oval
                            if (dist < 0.85) applyTexture = true; 
                        }

                        if (applyTexture) {
                            // Scale coordinates down to match previous math bounds (-10 to 10 approx)
                            const mathX = (x / (width/2)) * 10;
                            const mathY = (y / (height/2)) * 10;
                            const zVal = zFunc(mathX, mathY);
                            if(!isNaN(zVal)) positions.setZ(i, z + zVal);
                        }
                    }
                }
                baseGeo.computeVertexNormals();

                // 3. Generate Branding Text (Back of Card)
                const textGeos = [];
                
                // Company Logo
                const logoGeo = new TextGeometry('TOUCHY SUBJECTS LLC', {
                    font: loadedFont, size: 3.5, height: 0.5, curveSegments: 3
                });
                logoGeo.center();
                logoGeo.translate(0, 10, -thickness/2); // Position on bottom, facing down
                logoGeo.rotateX(Math.PI); // Flip so it prints correctly on bed
                textGeos.push(logoGeo);

                // Edition Name
                const nameGeo = new TextGeometry(editionName.toUpperCase(), {
                    font: loadedFont, size: 2.5, height: 0.5, curveSegments: 3
                });
                nameGeo.center();
                nameGeo.translate(0, -10, -thickness/2);
                nameGeo.rotateX(Math.PI);
                textGeos.push(nameGeo);

                // 4. Merge Everything into one Solid Manifold STL
                const finalGeo = BufferGeometryUtils.mergeGeometries([baseGeo, ...textGeos]);

                currentMesh = new THREE.Mesh(finalGeo, material);
                scene.add(currentMesh);

            } catch (e) {
                console.error(e);
                errorMsg.style.display = 'block';
            }
        }

        // --- Slipcase Generator ---
        function exportSlipcase() {
            const format = document.getElementById('format-select').value;
            let slipGeo;
            
            // Generate a solid block slightly larger than the format. 
            // The slicer's "Vase Mode" will hollow it out perfectly.
            const height = 90; // Tall enough to cover the item
            
            if (format === 'card') {
                slipGeo = new THREE.BoxGeometry(65, 91, height, 50, 50, 50);
            } else if (format === 'coin') {
                slipGeo = new THREE.CylinderGeometry(26, 26, height, 64, 50);
                slipGeo.rotateX(Math.PI / 2); // Align for math processing
            } else if (format === 'stone') {
                slipGeo = new THREE.CylinderGeometry(31, 31, height, 64, 50);
                slipGeo.scale(1, 1, 82/62);
                slipGeo.rotateX(Math.PI / 2);
            }

            // Add a wavy grip texture to the OUTSIDE walls
            const positions = slipGeo.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const y = positions.getY(i);
                const z = positions.getZ(i);

                // For box, displace X and Y faces
                if (format === 'card') {
                    if (Math.abs(x) > 32 || Math.abs(y) > 45) {
                        // Apply sine wave based on Z height for ribbed grip
                        const wave = Math.sin(z * 0.5) * 0.5;
                        if (x > 0) positions.setX(i, x + wave);
                        else if (x < 0) positions.setX(i, x - wave);
                        
                        if (y > 0) positions.setY(i, y + wave);
                        else if (y < 0) positions.setY(i, y - wave);
                    }
                } else {
                    // For cylinders, displace radial edge
                    const dist = Math.sqrt(x*x + y*y);
                    if (dist > 25) { // Roughly outer edge
                        const angle = Math.atan2(y, x);
                        const wave = Math.sin(z * 0.5) * 0.5; // Vertical ribs
                        positions.setX(i, x + Math.cos(angle) * wave);
                        positions.setY(i, y + Math.sin(angle) * wave);
                    }
                }
            }
            slipGeo.computeVertexNormals();
            
            // Export directly (no need to render to scene)
            const exportMesh = new THREE.Mesh(slipGeo, material);
            const exporter = new STLExporter();
            const stlString = exporter.parse(exportMesh);
            triggerDownload(stlString, `BlindBox_Sleeve_${format}.stl`);
        }

        // --- Logic Builder & UI ---
        function buildComboEquation() {
            const baseEq = document.getElementById('base-select').value;
            const microEq = document.getElementById('micro-select').value;
            const intensity = document.getElementById('intensity').value;
            const rotation = document.getElementById('rotation').value;

            document.getElementById('intensity-val').textContent = intensity;
            document.getElementById('rotation-val').textContent = rotation + '°';

            const eqStr = `(function(x, y) {
    const th = ${rotation} * Math.PI / 180;
    const rx = x * Math.cos(th) - y * Math.sin(th);
    const ry = x * Math.sin(th) + y * Math.cos(th);
    const base = (x, y) => ${baseEq};
    const micro = (x, y) => ${microEq};
    return base(x, y) + ${intensity} * micro(rx, ry);
})(x, y)`;

            document.getElementById('equation-input').value = eqStr;
            generateSurface();
        }

        function triggerDownload(content, filename) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.style.display = 'none'; link.href = url; link.download = filename;
            document.body.appendChild(link); link.click();
            document.body.removeChild(link); URL.revokeObjectURL(url);
        }

        function initUI() {
            const baseSelect = document.getElementById('base-select');
            basePatterns.forEach(p => baseSelect.add(new Option(p.title, p.eq)));
            
            const microSelect = document.getElementById('micro-select');
            microTextures.forEach(p => microSelect.add(new Option(p.title, p.eq)));

            // Events
            baseSelect.addEventListener('change', buildComboEquation);
            microSelect.addEventListener('change', buildComboEquation);
            document.getElementById('intensity').addEventListener('input', buildComboEquation);
            document.getElementById('rotation').addEventListener('input', buildComboEquation);
            document.getElementById('format-select').addEventListener('change', generateSurface);
            document.getElementById('edition-name').addEventListener('input', generateSurface);
            
            document.getElementById('btn-render').addEventListener('click', generateSurface);
            
            document.getElementById('btn-export').addEventListener('click', () => {
                const exporter = new STLExporter();
                const stlString = exporter.parse(scene);
                const format = document.getElementById('format-select').value;
                triggerDownload(stlString, `TouchySubjects_${format}_Solid.stl`);
            });

            document.getElementById('btn-export-box').addEventListener('click', exportSlipcase);

            document.getElementById('btn-gacha').addEventListener('click', () => {
                baseSelect.selectedIndex = Math.floor(Math.random() * basePatterns.length);
                microSelect.selectedIndex = Math.floor(Math.random() * microTextures.length);
                document.getElementById('intensity').value = (Math.random() * 2).toFixed(2);
                document.getElementById('rotation').value = Math.floor(Math.random() * 36) * 10;
                
                const names = ["Ethereal", "Kinetic", "Quantum", "Echo", "Void", "Prism", "Neon"];
                const adjectives = ["Ripple", "Burst", "Matrix", "Shift", "Pulse", "Drift"];
                document.getElementById('edition-name').value = 
                    names[Math.floor(Math.random()*names.length)] + " " + adjectives[Math.floor(Math.random()*adjectives.length)];
                
                buildComboEquation();
            });

            // Initial Build
            baseSelect.selectedIndex = 1; 
            microSelect.selectedIndex = 0;
            buildComboEquation();
        }

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        animate();
    </script>
</body>
</html>
