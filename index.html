<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touchy Subjects LLC - Tactile Generator</title>
    <style>
        :root {
            --bg-color: #1a1a1f;
            --panel-bg: #22222a;
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
            --accent: #d84b7b;
            --accent-hover: #b83a60;
            --border: #333340;
            --panel-width: 450px;
        }

        body {
            margin: 0; padding: 0; display: flex; height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-main); overflow: hidden;
        }

        #sidebar {
            width: var(--panel-width); background-color: var(--panel-bg);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 2px 0 15px rgba(0,0,0,0.5); z-index: 10;
        }

        .panel-header { padding: 15px 20px; background-color: #17171d; border-bottom: 1px solid var(--border); }
        .panel-header h1 { margin: 0; font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
        .panel-header p { margin: 2px 0 0 0; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .panel-content { padding: 20px; overflow-y: auto; flex-grow: 1; }

        .section-title {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); margin: 20px 0 10px 0; border-bottom: 1px solid var(--border); padding-bottom: 5px;
        }
        .section-title:first-child { margin-top: 0; }

        .control-group { margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.8rem; font-weight: 600; color: #d0d0df; }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%; padding: 8px 10px; background-color: #131318; border: 1px solid var(--border);
            color: var(--text-main); border-radius: 4px; font-family: monospace; box-sizing: border-box; font-size: 0.85rem;
        }
        textarea { resize: vertical; min-height: 80px; color: #a4b4ff; }
        select { cursor: pointer; font-family: inherit; }
        input[type="range"] { width: 100%; margin: 5px 0; cursor: pointer; accent-color: var(--accent); }

        button {
            width: 100%; padding: 10px; background-color: var(--accent); color: white; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.85rem;
        }
        button:hover { background-color: var(--accent-hover); }
        button.secondary { background-color: #2a2a35; border: 1px solid var(--border); color: var(--text-main); }
        button.secondary:hover { background-color: #353545; }
        button.action { background-color: #4a90e2; }
        button.action:hover { background-color: #357abd; }

        #canvas-container { flex-grow: 1; position: relative; background: radial-gradient(circle at center, #252530 0%, #101015 100%); }
        #error-msg {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 8px 16px; border-radius: 4px; display: none; z-index: 20; font-weight: bold; font-size: 0.9rem;
            background-color: rgba(255, 74, 74, 0.9); color: white;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="sidebar">
        <div class="panel-header">
            <h1>Touchy Subjects LLC</h1>
            <p>Tactile Geometry Generator</p>
        </div>
        <div class="panel-content">
            
            <div class="section-title">1. Physical Format</div>
            <div class="control-group">
                <select id="format-select">
                    <option value="square" selected>Square Card (63x63mm)</option>
                    <option value="card">Standard Card (63x88mm)</option>
                    <option value="bracelet">Interlocking Bracelet Link</option>
                </select>
            </div>

            <div class="section-title">2. Equation Library</div>
            <div class="control-group">
                <label>Preset Designs</label>
                <select id="preset-select">
                    <option value="">-- Select a Preset --</option>
                </select>
            </div>

            <div class="section-title">3. Combo Builder</div>
            <button id="btn-gacha" class="secondary">🎲 Randomize Combo</button>
            
            <div class="control-group">
                <label>Base Pattern (Macro)</label>
                <select id="base-select"></select>
            </div>
            <div class="control-group">
                <label>Micro Detail (Texture)</label>
                <select id="micro-select"></select>
            </div>

            <div class="control-group grid-2">
                <div>
                    <label>Intensity <span id="intensity-val">0.8</span></label>
                    <input type="range" id="intensity" min="0" max="3" step="0.05" value="0.8">
                </div>
                <div>
                    <label>Rotation <span id="rotation-val">45°</span></label>
                    <input type="range" id="rotation" min="0" max="360" step="5" value="45">

            </div>

            <div class="section-title">4. Raw Mathematical Logic</div>
            <div class="control-group">
                <label>Z = f(x, y) JavaScript Math</label>
                <textarea id="equation-input"></textarea>
            </div>

            <button id="btn-render">Force Render Surface</button>
            <button id="btn-export" class="action">💾 Export Solid STL</button>
        </div>
    </div>

    <div id="canvas-container">
        <div id="error-msg">Invalid Geometry Logic</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js';

        // --- Data Banks ---
        const equationLibrary = [
            { id: 'ripple', title: 'The Water Ripple', eq: 'Math.sin(Math.sqrt(x*x + y*y))' },
            { id: 'egg', title: 'The Egg Carton', eq: 'Math.sin(x) * Math.cos(y)' },
            { id: 'saddle', title: 'The Saddle', eq: '(x*x - y*y) / 10' },
            { id: 'sombrero', title: 'The Sombrero', eq: '10 * Math.sin(Math.sqrt(x*x + y*y)) / (Math.sqrt(x*x + y*y) + 0.001)' },
            { id: 'waves', title: 'Intersecting Waves', eq: 'Math.sin(x) + Math.cos(y)' },
            { id: 'knurling', title: 'Diamond Knurling', eq: 'Math.abs(Math.sin(x)) + Math.abs(Math.cos(y))' },
            { id: 'spikes', title: 'Soft Spikes', eq: 'Math.sin(x * y)' },
            { id: 'terrain', title: 'Rolling Terrain', eq: 'Math.sin(x) + 0.5 * Math.sin(2 * y) + 0.25 * Math.cos(3 * x)' },
            { id: 'waffle', title: 'The Waffle Iron', eq: 'Math.cos(x) + Math.cos(y) + Math.cos(x+y)' },
            { id: 'nodes', title: 'Massage Nodes', eq: '2 * Math.abs(Math.sin(x)) * Math.abs(Math.sin(y))' },
            { id: 'fingerprint', title: 'The Fingerprint', eq: 'Math.sin(Math.sqrt(x*x + y*y) - Math.atan2(y, x) * 3)' },
            { id: 'corduroy', title: 'Directional Corduroy', eq: 'Math.sin(2 * x + Math.sin(y))' },
            { id: 'dimples', title: 'Dimpled Surface', eq: '-(Math.pow(Math.cos(x), 2) + Math.pow(Math.cos(y), 2))' },
            { id: 'macromicro', title: 'Macro/Micro Dual-Feed', eq: 'Math.sin(x/2) * Math.cos(y/2) + 0.3 * Math.sin(x*4) * Math.cos(y*4)' },
            { id: 'interference', title: 'Interference Static', eq: 'Math.sin((x * y) / 3) * Math.cos(x + y)' },
            { id: 'glitch', title: 'Digital Glitch', eq: 'Math.floor(Math.sin(x) * 3) / 3 + Math.floor(Math.cos(y) * 3) / 3' },
            { id: 'dragon', title: 'Dragon Scales', eq: '0.5 * Math.sin(x) + Math.abs(Math.sin(x+y))' },
            { id: 'braided', title: 'Braided Cord', eq: 'Math.sin(x + Math.sin(y)) + Math.cos(y + Math.cos(x))' },
            { id: 'thorns', title: 'Crystalline Thorns', eq: 'Math.sqrt(Math.abs(Math.sin(x) * Math.cos(y)))' },
            { id: 'starburst', title: 'The Starburst', eq: 'Math.sin(Math.atan2(y, x) * 12)' },
            { id: 'bubble', title: 'Bubble Wrap', eq: 'Math.pow(Math.sin(x) * Math.sin(y), 2)' },
            { id: 'pyramid', title: 'Stepped Pyramid', eq: 'Math.floor(x) + Math.floor(y)' },
            { id: 'linear', title: 'Linear Micro-Vibrations', eq: 'x + 0.1 * Math.sin(y*5)' },

            // Standard Forms
            { id: 'softRollingWaves', title: 'Soft rolling waves', eq: '1.5*(Math.sin(x)+Math.cos(y))' },
            { id: 'gentleDiagonalWave', title: 'Gentle diagonal wave', eq: '2*Math.sin((x+y)/2)' },
            { id: 'wavyFabricRibbon', title: 'Wavy fabric / ribbon', eq: '1.2*Math.sin(x/1.5)+0.8*Math.cos(y/2)+0.2*x' },
            { id: 'oceanRippleSurface', title: 'Ocean ripple surface', eq: '2*Math.sin(Math.sqrt(x*x+y*y))' },
            { id: 'tightCircularRipples', title: 'Tight circular ripples', eq: '1.5*Math.sin(2*Math.sqrt(x*x+y*y))' },
            { id: 'raisedCenterDome', title: 'Raised center dome', eq: '5*Math.exp(-(x*x+y*y)/50)' },
            { id: 'softCraterBowl', title: 'Soft crater / bowl', eq: '-4*Math.exp(-(x*x+y*y)/35)' },
            { id: 'donutLikeRaisedRing', title: 'Donut-like raised ring', eq: '3*Math.exp(-Math.pow(Math.sqrt(x*x+y*y)-6,2)/6)' },
            { id: 'flowerPetals', title: 'Flower petals', eq: '2.5*Math.sin(6*Math.atan2(y,x))*Math.exp(-(x*x+y*y)/120)' },
            { id: 'pinwheelSurface', title: 'Pinwheel surface', eq: '2*Math.sin(4*Math.atan2(y,x)+Math.sqrt(x*x+y*y))' },
            { id: 'checkerboardHills', title: 'Checkerboard hills', eq: '1.5*Math.sin(x)*Math.sin(y)' },
            { id: 'quiltedCushion', title: 'Quilted cushion', eq: '1.2*Math.cos(x)*Math.cos(y)+0.5*Math.sin(2*x)*Math.sin(2*y)' },
            { id: 'topographicTerrain', title: 'Topographic terrain', eq: '1.2*Math.sin(x/2)+1.1*Math.cos(y/2)+0.7*Math.sin((x+y)/3)' },
            { id: 'organicBlobSurface', title: 'Organic blob surface', eq: '1.4*Math.sin(x/2)+1.2*Math.cos(y/3)+0.8*Math.sin((x*y)/25)' },
            { id: 'spikyRadialStar', title: 'Spiky radial star', eq: '2*Math.sin(8*Math.atan2(y,x))*(1-Math.sqrt(x*x+y*y)/18)' },
            { id: 'sunburstRidges', title: 'Sunburst ridges', eq: '1.2*Math.sin(12*Math.atan2(y,x))+0.2*Math.sqrt(x*x+y*y)' },
            { id: 'spiralShell', title: 'Spiral shell', eq: '0.3*Math.sqrt(x*x+y*y)+2*Math.sin(3*Math.atan2(y,x)+Math.sqrt(x*x+y*y))' },
            { id: 'mountainPeak', title: 'Mountain peak', eq: '6/(1+0.08*(x*x+y*y))' },
            { id: 'volcanoCone', title: 'Volcano cone', eq: '4*Math.exp(-(x*x+y*y)/80)-3*Math.exp(-(x*x+y*y)/10)' },
            { id: 'raisedXForm', title: 'Raised X form', eq: '2*Math.exp(-Math.pow(x-y,2)/8)+2*Math.exp(-Math.pow(x+y,2)/8)' },
            { id: 'raisedCrossPlusSign', title: 'Raised cross / plus sign', eq: '2*Math.exp(-x*x/5)+2*Math.exp(-y*y/5)' },
            { id: 'softSquareCushion', title: 'Soft square cushion', eq: '3*Math.exp(-(Math.pow(x,4)+Math.pow(y,4))/8000)' },
            { id: 'wovenBasketTexture', title: 'Woven basket texture', eq: '0.8*Math.sin(2*x)+0.8*Math.sin(2*y)+0.4*Math.sin(4*(x+y))' },
            { id: 'lavaLampWaves', title: 'Lava lamp waves', eq: '1.5*Math.sin(x/2+Math.cos(y/2))+1.2*Math.cos(y/2+Math.sin(x/3))' },
            { id: 'subtleCoinTexture', title: 'Subtle coin texture', eq: '0.4*Math.sin(4*x)*Math.sin(4*y)+1.5*Math.exp(-(x*x+y*y)/70)' },

            // Strong Dramatic Sculptural Shapes
            { id: 'tallTwistedFlower', title: 'Tall twisted flower', eq: '4*Math.sin(5*Math.atan2(y,x))*Math.exp(-(x*x+y*y)/90)+1.5*Math.exp(-(x*x+y*y)/30)' },
            { id: 'deepRippleBowl', title: 'Deep ripple bowl', eq: '-3*Math.exp(-(x*x+y*y)/80)+1.5*Math.sin(1.5*Math.sqrt(x*x+y*y))' },
            { id: 'raisedMedallion', title: 'Raised medallion', eq: '3*Math.exp(-(x*x+y*y)/50)+0.7*Math.sin(8*Math.atan2(y,x))' },
            { id: 'mechanicalGearLikeSurface', title: 'Mechanical gear-like surface', eq: '2*Math.sin(10*Math.atan2(y,x))*(Math.sqrt(x*x+y*y)/12)+0.3*Math.sqrt(x*x+y*y)' },
            { id: 'meteorImpact', title: 'Meteor impact', eq: '3*Math.exp(-(x*x+y*y)/90)-5*Math.exp(-(x*x+y*y)/12)+0.5*Math.sin(3*Math.sqrt(x*x+y*y))' },
            { id: 'candySwirl', title: 'Candy swirl', eq: '2*Math.sin(Math.sqrt(x*x+y*y)+5*Math.atan2(y,x))' },
            { id: 'brainCoralTexture', title: 'Brain coral texture', eq: '0.8*Math.sin(3*x+Math.sin(y))+0.8*Math.cos(3*y+Math.cos(x))' },
            { id: 'liquidGlassWaves', title: 'Liquid glass waves', eq: '1.2*Math.sin(x/2)+1.2*Math.cos(y/2)+0.8*Math.sin(Math.sqrt(x*x+y*y))' }
        ];

        const basePatterns = [
            { title: 'Flat (Texture Only)', eq: '0' },
            { title: 'Gentle Rolling Waves', eq: 'Math.sin(x/2) + Math.cos(y/2)' },
            { title: 'Macro Dimples', eq: '-(Math.pow(Math.cos(x/2), 2) + Math.pow(Math.cos(y/2), 2))' },
            { title: 'Terrain Hills', eq: 'Math.sin(x/2) + 0.5 * Math.sin(y)' },
            { title: 'Saddle Curve', eq: '(x*x - y*y) / 15' },
            { title: 'Pyramid Steps', eq: 'Math.floor(x/2) + Math.floor(y/2)' }
        ];

        const microTextures = [
            { title: 'Diamond Knurling', eq: 'Math.abs(Math.sin(x*4)) + Math.abs(Math.cos(y*4))' },
            { title: 'Waffle Grid', eq: 'Math.cos(x*4) + Math.cos(y*4) + Math.cos((x+y)*4)' },
            { title: 'Crystalline Thorns', eq: 'Math.sqrt(Math.abs(Math.sin(x*4) * Math.cos(y*4)))' },
            { title: 'Glitch Mapping', eq: 'Math.floor(Math.sin(x*5) * 3)/3 + Math.floor(Math.cos(y*5) * 3)/3' },
            { title: 'Directional Grain', eq: 'Math.sin(x*8 + Math.sin(y*2))' },
            { title: 'Bubble Wrap Domes', eq: 'Math.pow(Math.sin(x*3) * Math.sin(y*3), 2)' },
            { title: 'Smooth Ripple', eq: 'Math.sin(Math.sqrt(x*x + y*y)*3)' }
        ];

        // --- SDF Helpers for Bracelet Interlock ---
        function sdBox(px, py, bx, by) {
            let dx = Math.abs(px) - bx;
            let dy = Math.abs(py) - by;
            return Math.sqrt(Math.max(dx, 0)**2 + Math.max(dy, 0)**2) + Math.min(Math.max(dx, dy), 0);
        }
        
        function sdCircle(px, py, r) {
            return Math.sqrt(px*px + py*py) - r;
        }

        function braceletSDF(px, py) {
            // Main body is 30x40mm (bx=15, by=20)
            let d_box = sdBox(px, py, 15, 20);

            // Jigsaw Tab (+Y direction)
            let d_tab_circle = sdCircle(px, py - 25, 5.0);
            let d_tab_neck = sdBox(px, py - 22, 3.0, 2.5); // Overlaps into body to merge nicely
            let d_tab = Math.min(d_tab_circle, d_tab_neck);
            let d_shape = Math.min(d_box, d_tab);

            // Jigsaw Slot (-Y direction). Uses 0.2mm tolerance for mechanical snap fit.
            let d_slot_circle = sdCircle(px, py + 15, 5.2);
            let d_slot_neck = sdBox(px, py + 18, 3.2, 2.5); 
            let d_slot = Math.min(d_slot_circle, d_slot_neck);

            return Math.max(d_shape, -d_slot);
        }


        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, -60, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(20, -20, 40);
        scene.add(dirLight);

        // Standard PLA/Silk Material
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xd84b7b, roughness: 0.3, metalness: 0.2 
        });

        let currentMesh = null;

        // --- Core Generator ---
        function generateSurface() {
            const errorMsg = document.getElementById('error-msg');
            const format = document.getElementById('format-select').value;
            const eqStr = document.getElementById('equation-input').value;

            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
            }

            try {
                const zFunc = new Function('x', 'y', 'return ' + eqStr + ';');
                zFunc(0,0); // Test
                errorMsg.style.display = 'none';

                let width = 63, height = 63; // Default Square
                if (format === 'card') { height = 88; }
                if (format === 'bracelet') { width = 45; height = 65; } // Base geometry footprint needed to cover SDF

                const thickness = 3.0;
                
                // Design parameters
                const radius = 6.0;      // Corner rounding radius
                const topBevel = 1.2;    // Top edge chamfer
                const botBevel = 0.8;    // Bottom edge chamfer (prevents elephant's foot)
                const margin = topBevel + 2.5; // Flat rim before texture starts

                // Create a dense box geometry
                const baseGeo = new THREE.BoxGeometry(width, height, thickness, 150, 150, 1);
                const positions = baseGeo.attributes.position;

                // Center points for the corner radius calculation
                const cx = (width / 2) - radius;
                const cy = (height / 2) - radius;

                for (let i = 0; i < positions.count; i++) {
                    let x = positions.getX(i);
                    let y = positions.getY(i);
                    let z = positions.getZ(i);

                    let mappedX = x;
                    let mappedY = y;
                    let D = 0; // Distance to the boundary (positive inside, negative outside)

                    if (format === 'bracelet') {
                        D = -braceletSDF(x, y); 
                        
                        if (D < 0) {
                            // If we are outside the puzzle piece, project point perfectly to the SDF boundary via Gradient Descent
                            let px = x, py = y;
                            for (let step = 0; step < 15; step++) {
                                let d = braceletSDF(px, py);
                                if (d <= 0.005) break; 
                                
                                let eps = 0.01;
                                let dx = (braceletSDF(px+eps, py) - braceletSDF(px-eps, py)) / (2*eps);
                                let dy = (braceletSDF(px, py+eps) - braceletSDF(px, py-eps)) / (2*eps);
                                
                                let len = Math.sqrt(dx*dx + dy*dy);
                                if (len > 0) { dx /= len; dy /= len; }
                                
                                px -= dx * d;
                                py -= dy * d;
                            }
                            mappedX = px;
                            mappedY = py;
                            D = 0; // It's strictly on the boundary now
                        }
                    } else {
                        // Original Squircle Mapping for Cards
                        let ax = Math.abs(x);
                        let ay = Math.abs(y);

                        // If vertex is in the corner zone
                        if (ax > cx && ay > cy) {
                            let u = Math.min(1, Math.max(0, (ax - cx) / radius));
                            let v = Math.min(1, Math.max(0, (ay - cy) / radius));
                            
                            // Map square grid to circular arc
                            let u_new = u * Math.sqrt(1 - (v * v) / 2);
                            let v_new = v * Math.sqrt(1 - (u * u) / 2);
                            
                            mappedX = Math.sign(x) * (cx + u_new * radius);
                            mappedY = Math.sign(y) * (cy + v_new * radius);
                        }

                        // Calculate Distance (D) to the new rounded boundary
                        let nax = Math.abs(mappedX);
                        let nay = Math.abs(mappedY);
                        
                        if (nax > cx && nay > cy) {
                            D = radius - Math.sqrt(Math.pow(nax - cx, 2) + Math.pow(nay - cy, 2));
                        } else if (nax > cx) {
                            D = width / 2 - nax;
                        } else if (nay > cy) {
                            D = height / 2 - nay;
                        } else {
                            D = Math.min(width / 2 - nax, height / 2 - nay);
                        }
                        
                        if (D < 0) D = 0; // Fix edge precision
                    }

                    positions.setX(i, mappedX);
                    positions.setY(i, mappedY);

                    // 3. Apply Bevels and Texture based on distance from nearest edge (D)
                    let newZ = z;

                    if (z > 0.1) {
                        // Top Face: Apply Bevel
                        if (D < topBevel) {
                            newZ = z - (topBevel - D);
                        }
                        
                        // To ensure the interlocking links form a continuous visual band when snapped together,
                        // we calculate the texture margin dynamically based on the format.
                        let texD = D;
                        
                        if (format === 'bracelet') {
                            // Instead of a flat margin wrapping entirely around the tab and slot (which interrupts 
                            // the texture visually), we restrict the margin to ONLY the left and right borders.
                            // This allows the math texture to flow directly onto the tab and into the slot cuts.
                            texD = 15 - Math.abs(mappedX); 
                        }

                        // Top Face: Apply Math Texture inside the safe margin
                        if (texD > margin) {
                            // Standardize coordinate math mapping regardless of physical format geometry scale
                            const mathX = (mappedX / 31.5) * 10;
                            const mathY = (mappedY / 31.5) * 10;
                            const zVal = zFunc(mathX, mathY);
                            if(!isNaN(zVal)) newZ += zVal;
                        }
                    } else if (z < -0.1) {
                        // Bottom Face: Apply smaller bevel to combat print curling
                        if (D < botBevel) {
                            newZ = z + (botBevel - D);
                        }
                    }

                    positions.setZ(i, newZ);
                }
                
                baseGeo.computeVertexNormals();
                currentMesh = new THREE.Mesh(baseGeo, material);
                scene.add(currentMesh);

            } catch (e) {
                console.error(e);
                errorMsg.textContent = "Logic Error: " + e.message;
                errorMsg.style.display = 'block';
            }
        }

        // --- Logic Builder & UI ---
        function buildComboEquation() {
            const baseEq = document.getElementById('base-select').value;
            const microEq = document.getElementById('micro-select').value;
            const intensity = document.getElementById('intensity').value;
            const rotation = document.getElementById('rotation').value;

            document.getElementById('intensity-val').textContent = intensity;
            document.getElementById('rotation-val').textContent = rotation + '°';

            const eqStr = `(function(x, y) {
    const th = ${rotation} * Math.PI / 180;
    const rx = x * Math.cos(th) - y * Math.sin(th);
    const ry = x * Math.sin(th) + y * Math.cos(th);
    const base = (x, y) => ${baseEq};
    const micro = (x, y) => ${microEq};
    return base(x, y) + ${intensity} * micro(rx, ry);
})(x, y)`;

            document.getElementById('equation-input').value = eqStr;
            document.getElementById('preset-select').value = "";
            generateSurface();
        }

        function triggerDownload(content, filename) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.style.display = 'none'; link.href = url; link.download = filename;
            document.body.appendChild(link); link.click();
            document.body.removeChild(link); URL.revokeObjectURL(url);
        }

        function initUI() {
            const presetSelect = document.getElementById('preset-select');
            equationLibrary.forEach(p => presetSelect.add(new Option(p.title, p.eq)));

            const baseSelect = document.getElementById('base-select');
            basePatterns.forEach(p => baseSelect.add(new Option(p.title, p.eq)));
            
            const microSelect = document.getElementById('micro-select');
            microTextures.forEach(p => microSelect.add(new Option(p.title, p.eq)));

            baseSelect.addEventListener('change', buildComboEquation);
            microSelect.addEventListener('change', buildComboEquation);
            document.getElementById('intensity').addEventListener('input', buildComboEquation);
            document.getElementById('rotation').addEventListener('input', buildComboEquation);
            
            presetSelect.addEventListener('change', (e) => {
                if(e.target.value) {
                    document.getElementById('equation-input').value = e.target.value;
                    generateSurface();
                }
            });

            document.getElementById('format-select').addEventListener('change', generateSurface);
            document.getElementById('btn-render').addEventListener('click', generateSurface);
            
            document.getElementById('btn-export').addEventListener('click', () => {
                const exporter = new STLExporter();
                const stlString = exporter.parse(scene); 
                const format = document.getElementById('format-select').value;
                triggerDownload(stlString, `TouchySubjects_${format}_Solid.stl`);
            });

            document.getElementById('btn-gacha').addEventListener('click', () => {
                baseSelect.selectedIndex = Math.floor(Math.random() * basePatterns.length);
                microSelect.selectedIndex = Math.floor(Math.random() * microTextures.length);
                document.getElementById('intensity').value = (Math.random() * 2).toFixed(2);
                document.getElementById('rotation').value = Math.floor(Math.random() * 36) * 10;
                buildComboEquation();
            });

            baseSelect.selectedIndex = 1; 
            microSelect.selectedIndex = 0;
            buildComboEquation();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        initUI();
        animate();
    </script>
</body>
</html>
