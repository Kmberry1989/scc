<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensory Collectible Creator - Pro</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-bg: #2b2b36;
            --text-main: #f0f0f5;
            --text-muted: #a0a0b0;
            --accent: #4a90e2;
            --accent-hover: #357abd;
            --border: #404050;
            --panel-width: 420px;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        #sidebar {
            width: var(--panel-width);
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .panel-header {
            padding: 15px 20px;
            background-color: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
        }

        .panel-header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .panel-content {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin: 25px 0 10px 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        
        .section-title:first-child { margin-top: 0; }

        .control-group { margin-bottom: 15px; }

        label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 8px 10px;
            background-color: #1a1a20;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            font-family: monospace;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-size: 0.8rem;
            line-height: 1.3;
            background-color: #111115;
            color: #88ff88;
        }

        select { cursor: pointer; font-family: inherit; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        input[type="range"] {
            width: 100%;
            margin: 5px 0;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        button:hover { background-color: var(--accent-hover); }
        
        button.secondary {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        button.secondary:hover { background-color: rgba(74, 144, 226, 0.1); }

        #saved-bank { margin-top: 10px; }

        .saved-item {
            background-color: #1a1a20;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 0.9rem;
        }

        .saved-item:hover { border-color: var(--accent); }

        .delete-btn {
            background: none;
            border: none;
            color: #ff4a4a;
            width: auto;
            padding: 0 5px;
            margin: 0;
            font-size: 1.2rem;
        }
        .delete-btn:hover { background: none; color: #ff7a7a; }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #2a2a35 0%, #101015 100%);
        }

        #error-msg {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 74, 74, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            display: none;
            z-index: 20;
            font-weight: bold;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="sidebar">
        <div class="panel-header">
            <h1>Sensory Collectible Creator</h1>
        </div>
        <div class="panel-content">
            
            <div class="section-title">Combo Builder</div>
            
            <div class="control-group">
                <label>Base Pattern (Macro)</label>
                <select id="base-select"></select>
            </div>
            
            <div class="control-group">
                <label>Micro Detail (Texture)</label>
                <select id="micro-select"></select>
            </div>

            <div class="control-group grid-2">
                <div>
                    <label>Intensity <span id="intensity-val">0.5</span></label>
                    <input type="range" id="intensity" min="0" max="2" step="0.05" value="0.5">
                </div>
                <div>
                    <label>Rotation <span id="rotation-val">45°</span></label>
                    <input type="range" id="rotation" min="0" max="360" step="5" value="45">
                </div>
            </div>

            <div class="section-title">Raw Mathematical Logic</div>
            
            <div class="control-group">
                <label>Presets / Single Equations</label>
                <select id="preset-select">
                    <option value="">-- Load a classic preset --</option>
                </select>
            </div>

            <div class="control-group">
                <label>Z = f(x, y) JavaScript</label>
                <textarea id="equation-input"></textarea>
            </div>

            <div class="control-group grid-2">
                <div>
                    <label>Bounds (Min)</label>
                    <input type="number" id="bounds-min" value="-10" step="1">
                </div>
                <div>
                    <label>Bounds (Max)</label>
                    <input type="number" id="bounds-max" value="10" step="1">
                </div>
            </div>

            <button id="btn-render">Force Render</button>
            <button id="btn-export" class="secondary">Export STL</button>

            <div class="section-title">Design Bank</div>
            <div id="saved-bank">
                <div class="control-group grid-2">
                    <input type="text" id="save-name" placeholder="Name design...">
                    <button id="btn-save" style="margin-bottom:0;">Save</button>
                </div>
                <div id="saved-list"></div>
            </div>
        </div>
    </div>

    <div id="canvas-container">
        <div id="error-msg">Invalid JavaScript Equation</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js';

        // --- 1. Data Banks ---
        
        // Full Library for Presets
        const equationLibrary = [
            { id: 'ripple', title: 'The Water Ripple', eq: 'Math.sin(Math.sqrt(x*x + y*y))' },
            { id: 'egg', title: 'The Egg Carton', eq: 'Math.sin(x) * Math.cos(y)' },
            { id: 'saddle', title: 'The Saddle', eq: '(x*x - y*y) / 10' },
            { id: 'sombrero', title: 'The Sombrero', eq: '10 * Math.sin(Math.sqrt(x*x + y*y)) / (Math.sqrt(x*x + y*y) + 0.001)' },
            { id: 'waves', title: 'Intersecting Waves', eq: 'Math.sin(x) + Math.cos(y)' },
            { id: 'knurling', title: 'Diamond Knurling', eq: 'Math.abs(Math.sin(x)) + Math.abs(Math.cos(y))' },
            { id: 'spikes', title: 'Soft Spikes', eq: 'Math.sin(x * y)' },
            { id: 'terrain', title: 'Rolling Terrain', eq: 'Math.sin(x) + 0.5 * Math.sin(2 * y) + 0.25 * Math.cos(3 * x)' },
            { id: 'waffle', title: 'The Waffle Iron', eq: 'Math.cos(x) + Math.cos(y) + Math.cos(x+y)' },
            { id: 'nodes', title: 'Massage Nodes', eq: '2 * Math.abs(Math.sin(x)) * Math.abs(Math.sin(y))' },
            { id: 'fingerprint', title: 'The Fingerprint', eq: 'Math.sin(Math.sqrt(x*x + y*y) - Math.atan2(y, x) * 3)' },
            { id: 'corduroy', title: 'Directional Corduroy', eq: 'Math.sin(2 * x + Math.sin(y))' },
            { id: 'dimples', title: 'Dimpled Surface', eq: '-(Math.pow(Math.cos(x), 2) + Math.pow(Math.cos(y), 2))' },
            { id: 'macromicro', title: 'Macro/Micro Dual-Feed', eq: 'Math.sin(x/2) * Math.cos(y/2) + 0.3 * Math.sin(x*4) * Math.cos(y*4)' },
            { id: 'interference', title: 'Interference Static', eq: 'Math.sin((x * y) / 3) * Math.cos(x + y)' },
            { id: 'glitch', title: 'Digital Glitch', eq: 'Math.floor(Math.sin(x) * 3) / 3 + Math.floor(Math.cos(y) * 3) / 3' },
            { id: 'dragon', title: 'Dragon Scales', eq: '0.5 * Math.sin(x) + Math.abs(Math.sin(x+y))' },
            { id: 'braided', title: 'Braided Cord', eq: 'Math.sin(x + Math.sin(y)) + Math.cos(y + Math.cos(x))' },
            { id: 'thorns', title: 'Crystalline Thorns', eq: 'Math.sqrt(Math.abs(Math.sin(x) * Math.cos(y)))' },
            { id: 'starburst', title: 'The Starburst', eq: 'Math.sin(Math.atan2(y, x) * 12)' },
            { id: 'bubble', title: 'Bubble Wrap', eq: 'Math.pow(Math.sin(x) * Math.sin(y), 2)' },
            { id: 'pyramid', title: 'Stepped Pyramid', eq: 'Math.floor(x) + Math.floor(y)' },
            { id: 'linear', title: 'Linear Micro-Vibrations', eq: 'x + 0.1 * Math.sin(y*5)' }
        ];

        // Low-Frequency Base Patterns for the Combo Builder
        const basePatterns = [
            { title: 'Flat (Texture Only)', eq: '0' },
            { title: 'Gentle Rolling Waves', eq: 'Math.sin(x/2) + Math.cos(y/2)' },
            { title: 'Macro Dimples', eq: '-(Math.pow(Math.cos(x/2), 2) + Math.pow(Math.cos(y/2), 2))' },
            { title: 'Terrain Hills', eq: 'Math.sin(x/2) + 0.5 * Math.sin(y)' },
            { title: 'Saddle Curve', eq: '(x*x - y*y) / 15' },
            { title: 'Large Stepped Pyramid', eq: 'Math.floor(x/2) + Math.floor(y/2)' }
        ];

        // High-Frequency Micro Textures for the Combo Builder
        const microTextures = [
            { title: 'Diamond Knurling', eq: 'Math.abs(Math.sin(x*4)) + Math.abs(Math.cos(y*4))' },
            { title: 'Waffle Grid', eq: 'Math.cos(x*4) + Math.cos(y*4) + Math.cos((x+y)*4)' },
            { title: 'Crystalline Thorns', eq: 'Math.sqrt(Math.abs(Math.sin(x*4) * Math.cos(y*4)))' },
            { title: 'Digital Glitch Map', eq: 'Math.floor(Math.sin(x*5) * 3)/3 + Math.floor(Math.cos(y*5) * 3)/3' },
            { title: 'Directional Grain', eq: 'Math.sin(x*8 + Math.sin(y*2))' },
            { title: 'Bubble Wrap', eq: 'Math.pow(Math.sin(x*3) * Math.sin(y*3), 2)' }
        ];

        // --- 2. Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(15, 20, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x88bbff, 0.5);
        backLight.position.set(-10, 10, -10);
        scene.add(backLight);

        const gridHelper = new THREE.GridHelper(40, 40, 0x444455, 0x222233);
        gridHelper.position.y = -5;
        scene.add(gridHelper);

        const material = new THREE.MeshStandardMaterial({ 
            color: 0x4a90e2, roughness: 0.2, metalness: 0.1, side: THREE.DoubleSide
        });

        let currentMesh = null;

        // --- 3. Combo Builder Logic ---
        function buildComboEquation() {
            const baseEq = document.getElementById('base-select').value;
            const microEq = document.getElementById('micro-select').value;
            const intensity = document.getElementById('intensity').value;
            const rotation = document.getElementById('rotation').value;

            document.getElementById('intensity-val').textContent = intensity;
            document.getElementById('rotation-val').textContent = rotation + '°';

            // Constructing a safe, valid JS string to handle 2D rotation and combination
            const eqStr = `(function(x, y) {
    // 1. Calculate Rotation Matrix
    const th = ${rotation} * Math.PI / 180;
    const rx = x * Math.cos(th) - y * Math.sin(th);
    const ry = x * Math.sin(th) + y * Math.cos(th);
    
    // 2. Define Components
    const base = (x, y) => ${baseEq};
    const micro = (x, y) => ${microEq};
    
    // 3. Combine: Base + (Rotated Micro * Intensity)
    return base(x, y) + ${intensity} * micro(rx, ry);
})(x, y)`;

            document.getElementById('equation-input').value = eqStr;
            generateSurface();
        }

        // --- 4. Core Render Logic ---
        function generateSurface() {
            const eqStr = document.getElementById('equation-input').value;
            const min = parseFloat(document.getElementById('bounds-min').value);
            const max = parseFloat(document.getElementById('bounds-max').value);
            const errorMsg = document.getElementById('error-msg');

            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
            }

            try {
                const zFunc = new Function('x', 'y', 'return ' + eqStr + ';');
                zFunc(0, 0); // Test execution
                errorMsg.style.display = 'none';

                const size = max - min;
                const segments = 150; // High resolution
                const geometry = new THREE.PlaneGeometry(size, size, segments, segments);
                const positions = geometry.attributes.position;
                
                for (let i = 0; i < positions.count; i++) {
                    const localX = positions.getX(i);
                    const localY = positions.getY(i);
                    const mappedX = mapRange(localX, -size/2, size/2, min, max);
                    const mappedY = mapRange(localY, -size/2, size/2, min, max);

                    const zVal = zFunc(mappedX, mappedY);
                    if(!isNaN(zVal)) positions.setZ(i, zVal);
                }

                geometry.computeVertexNormals();
                currentMesh = new THREE.Mesh(geometry, material);
                currentMesh.rotation.x = -Math.PI / 2;
                currentMesh.castShadow = true;
                currentMesh.receiveShadow = true;
                scene.add(currentMesh);

            } catch (e) {
                console.error(e);
                errorMsg.style.display = 'block';
            }
        }

        function mapRange(value, inMin, inMax, outMin, outMax) {
            return (value - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;
        }

        function exportSTL() {
            if (!currentMesh) return;
            const exporter = new STLExporter();
            const stlString = exporter.parse(scene);
            const blob = new Blob([stlString], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.style.display = 'none';
            link.href = url;
            link.download = 'Sensory_Combo_Surface.stl';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // --- 5. UI & Storage Initialization ---
        function initUI() {
            // Populate Combo Builder Selects
            const baseSelect = document.getElementById('base-select');
            basePatterns.forEach(p => baseSelect.add(new Option(p.title, p.eq)));
            
            const microSelect = document.getElementById('micro-select');
            microTextures.forEach(p => microSelect.add(new Option(p.title, p.eq)));

            // Populate Master Presets Select
            const presetSelect = document.getElementById('preset-select');
            equationLibrary.forEach(p => presetSelect.add(new Option(p.title, p.eq)));

            // Event Listeners for Combo Builder (Auto-updates)
            baseSelect.addEventListener('change', buildComboEquation);
            microSelect.addEventListener('change', buildComboEquation);
            document.getElementById('intensity').addEventListener('input', buildComboEquation);
            document.getElementById('rotation').addEventListener('input', buildComboEquation);

            // Event Listener for Manual Preset Override
            presetSelect.addEventListener('change', (e) => {
                if(e.target.value) {
                    document.getElementById('equation-input').value = e.target.value;
                    generateSurface();
                }
            });

            // Buttons
            document.getElementById('btn-render').addEventListener('click', generateSurface);
            document.getElementById('btn-export').addEventListener('click', exportSTL);
            document.getElementById('btn-save').addEventListener('click', saveToBank);

            renderSavedBank();
            
            // Set initial state
            baseSelect.selectedIndex = 1; // Gentle Rolling Waves
            microSelect.selectedIndex = 0; // Diamond Knurling
            buildComboEquation();
        }

        function saveToBank() {
            const nameInput = document.getElementById('save-name');
            const name = nameInput.value.trim() || `Combo Design ${Date.now().toString().slice(-4)}`;
            const currentEq = document.getElementById('equation-input').value;
            const bMin = document.getElementById('bounds-min').value;
            const bMax = document.getElementById('bounds-max').value;

            const newSave = { id: Date.now(), name, eq: currentEq, min: bMin, max: bMax };
            let bank = JSON.parse(localStorage.getItem('sensoryBankPro') || '[]');
            bank.push(newSave);
            localStorage.setItem('sensoryBankPro', JSON.stringify(bank));
            
            nameInput.value = '';
            renderSavedBank();
        }

        function renderSavedBank() {
            const savedList = document.getElementById('saved-list');
            savedList.innerHTML = '';
            let bank = JSON.parse(localStorage.getItem('sensoryBankPro') || '[]');
            
            bank.forEach(item => {
                const div = document.createElement('div');
                div.className = 'saved-item';
                
                const textSpan = document.createElement('span');
                textSpan.textContent = item.name;
                textSpan.style.flexGrow = '1';
                
                textSpan.onclick = () => {
                    document.getElementById('equation-input').value = item.eq;
                    document.getElementById('bounds-min').value = item.min;
                    document.getElementById('bounds-max').value = item.max;
                    document.getElementById('preset-select').value = ""; // clear preset
                    generateSurface();
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '×';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    bank = bank.filter(b => b.id !== item.id);
                    localStorage.setItem('sensoryBankPro', JSON.stringify(bank));
                    renderSavedBank();
                };

                div.appendChild(textSpan);
                div.appendChild(delBtn);
                savedList.appendChild(div);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        initUI();
        animate();
    </script>
</body>
</html>
