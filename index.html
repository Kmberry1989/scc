<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touchy Subjects LLC - Tactile Generator</title>
    <style>
        :root {
            --bg-color: #1a1a1f;
            --panel-bg: #22222a;
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
            --accent: #d84b7b;
            --accent-hover: #b83a60;
            --border: #333340;
            --panel-width: 450px;
        }

        body {
            margin: 0; padding: 0; display: flex; height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-main); overflow: hidden;
        }

        #sidebar {
            width: var(--panel-width); background-color: var(--panel-bg);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            box-shadow: 2px 0 15px rgba(0,0,0,0.5); z-index: 10;
        }

        .panel-header { padding: 15px 20px; background-color: #17171d; border-bottom: 1px solid var(--border); }
        .panel-header h1 { margin: 0; font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
        .panel-header p { margin: 2px 0 0 0; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .panel-content { padding: 20px; overflow-y: auto; flex-grow: 1; }

        .section-title {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); margin: 20px 0 10px 0; border-bottom: 1px solid var(--border); padding-bottom: 5px;
        }
        .section-title:first-child { margin-top: 0; }

        .control-group { margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.8rem; font-weight: 600; color: #d0d0df; }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%; padding: 8px 10px; background-color: #131318; border: 1px solid var(--border);
            color: var(--text-main); border-radius: 4px; font-family: monospace; box-sizing: border-box; font-size: 0.85rem;
        }
        textarea { resize: vertical; min-height: 80px; color: #a4b4ff; }
        select { cursor: pointer; font-family: inherit; }
        input[type="range"] { width: 100%; margin: 5px 0; cursor: pointer; accent-color: var(--accent); }

        button {
            width: 100%; padding: 10px; background-color: var(--accent); color: white; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.85rem;
        }
        button:hover { background-color: var(--accent-hover); }
        button.secondary { background-color: #2a2a35; border: 1px solid var(--border); color: var(--text-main); }
        button.secondary:hover { background-color: #353545; }
        button.action { background-color: #4a90e2; }
        button.action:hover { background-color: #357abd; }

        #canvas-container { flex-grow: 1; position: relative; background: radial-gradient(circle at center, #252530 0%, #101015 100%); }
        #error-msg {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 8px 16px; border-radius: 4px; display: none; z-index: 20; font-weight: bold; font-size: 0.9rem;
            background-color: rgba(255, 74, 74, 0.9); color: white;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="sidebar">
        <div class="panel-header">
            <h1>Touchy Subjects LLC</h1>
            <p>Tactile Geometry Generator</p>
        </div>
        <div class="panel-content">
            
            <div class="section-title">1. Physical Format</div>
            <div class="control-group">
                <select id="format-select">
                    <option value="card">Standard Card (63x88mm)</option>
                    <option value="coin">Sensory Coin (Ø50mm)</option>
                    <option value="stone">Worry Stone (60x80mm Oval)</option>
                </select>
            </div>

            <div class="section-title">2. Equation Library</div>
            <div class="control-group">
                <label>Preset Designs</label>
                <select id="preset-select">
                    <option value="">-- Select a Preset --</option>
                </select>
            </div>

            <div class="section-title">3. Combo Builder</div>
            <button id="btn-gacha" class="secondary">🎲 Randomize Combo</button>
            
            <div class="control-group">
                <label>Base Pattern (Macro)</label>
                <select id="base-select"></select>
            </div>
            <div class="control-group">
                <label>Micro Detail (Texture)</label>
                <select id="micro-select"></select>
            </div>

            <div class="control-group grid-2">
                <div>
                    <label>Intensity <span id="intensity-val">0.8</span></label>
                    <input type="range" id="intensity" min="0" max="3" step="0.05" value="0.8">
                </div>
                <div>
                    <label>Rotation <span id="rotation-val">45°</span></label>
                    <input type="range" id="rotation" min="0" max="360" step="5" value="45">
                </div>
            </div>

            <div class="section-title">4. Raw Mathematical Logic</div>
            <div class="control-group">
                <label>Z = f(x, y) JavaScript Math</label>
                <textarea id="equation-input"></textarea>
            </div>

            <button id="btn-render">Force Render Surface</button>
            <button id="btn-export" class="action">💾 Export Solid STL</button>
        </div>
    </div>

    <div id="canvas-container">
        <div id="error-msg">Invalid Geometry Logic</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js';

        // --- Data Banks ---
        const equationLibrary = [
            { id: 'ripple', title: 'The Water Ripple', eq: 'Math.sin(Math.sqrt(x*x + y*y))' },
            { id: 'egg', title: 'The Egg Carton', eq: 'Math.sin(x) * Math.cos(y)' },
            { id: 'saddle', title: 'The Saddle', eq: '(x*x - y*y) / 10' },
            { id: 'sombrero', title: 'The Sombrero', eq: '10 * Math.sin(Math.sqrt(x*x + y*y)) / (Math.sqrt(x*x + y*y) + 0.001)' },
            { id: 'waves', title: 'Intersecting Waves', eq: 'Math.sin(x) + Math.cos(y)' },
            { id: 'knurling', title: 'Diamond Knurling', eq: 'Math.abs(Math.sin(x)) + Math.abs(Math.cos(y))' },
            { id: 'spikes', title: 'Soft Spikes', eq: 'Math.sin(x * y)' },
            { id: 'terrain', title: 'Rolling Terrain', eq: 'Math.sin(x) + 0.5 * Math.sin(2 * y) + 0.25 * Math.cos(3 * x)' },
            { id: 'waffle', title: 'The Waffle Iron', eq: 'Math.cos(x) + Math.cos(y) + Math.cos(x+y)' },
            { id: 'nodes', title: 'Massage Nodes', eq: '2 * Math.abs(Math.sin(x)) * Math.abs(Math.sin(y))' },
            { id: 'fingerprint', title: 'The Fingerprint', eq: 'Math.sin(Math.sqrt(x*x + y*y) - Math.atan2(y, x) * 3)' },
            { id: 'corduroy', title: 'Directional Corduroy', eq: 'Math.sin(2 * x + Math.sin(y))' },
            { id: 'dimples', title: 'Dimpled Surface', eq: '-(Math.pow(Math.cos(x), 2) + Math.pow(Math.cos(y), 2))' },
            { id: 'macromicro', title: 'Macro/Micro Dual-Feed', eq: 'Math.sin(x/2) * Math.cos(y/2) + 0.3 * Math.sin(x*4) * Math.cos(y*4)' },
            { id: 'interference', title: 'Interference Static', eq: 'Math.sin((x * y) / 3) * Math.cos(x + y)' },
            { id: 'glitch', title: 'Digital Glitch', eq: 'Math.floor(Math.sin(x) * 3) / 3 + Math.floor(Math.cos(y) * 3) / 3' },
            { id: 'dragon', title: 'Dragon Scales', eq: '0.5 * Math.sin(x) + Math.abs(Math.sin(x+y))' },
            { id: 'braided', title: 'Braided Cord', eq: 'Math.sin(x + Math.sin(y)) + Math.cos(y + Math.cos(x))' },
            { id: 'thorns', title: 'Crystalline Thorns', eq: 'Math.sqrt(Math.abs(Math.sin(x) * Math.cos(y)))' },
            { id: 'starburst', title: 'The Starburst', eq: 'Math.sin(Math.atan2(y, x) * 12)' },
            { id: 'bubble', title: 'Bubble Wrap', eq: 'Math.pow(Math.sin(x) * Math.sin(y), 2)' },
            { id: 'pyramid', title: 'Stepped Pyramid', eq: 'Math.floor(x) + Math.floor(y)' },
            { id: 'linear', title: 'Linear Micro-Vibrations', eq: 'x + 0.1 * Math.sin(y*5)' }
        ];

        const basePatterns = [
            { title: 'Flat (Texture Only)', eq: '0' },
            { title: 'Gentle Rolling Waves', eq: 'Math.sin(x/2) + Math.cos(y/2)' },
            { title: 'Macro Dimples', eq: '-(Math.pow(Math.cos(x/2), 2) + Math.pow(Math.cos(y/2), 2))' },
            { title: 'Terrain Hills', eq: 'Math.sin(x/2) + 0.5 * Math.sin(y)' },
            { title: 'Saddle Curve', eq: '(x*x - y*y) / 15' },
            { title: 'Pyramid Steps', eq: 'Math.floor(x/2) + Math.floor(y/2)' }
        ];

        const microTextures = [
            { title: 'Diamond Knurling', eq: 'Math.abs(Math.sin(x*4)) + Math.abs(Math.cos(y*4))' },
            { title: 'Waffle Grid', eq: 'Math.cos(x*4) + Math.cos(y*4) + Math.cos((x+y)*4)' },
            { title: 'Crystalline Thorns', eq: 'Math.sqrt(Math.abs(Math.sin(x*4) * Math.cos(y*4)))' },
            { title: 'Glitch Mapping', eq: 'Math.floor(Math.sin(x*5) * 3)/3 + Math.floor(Math.cos(y*5) * 3)/3' },
            { title: 'Directional Grain', eq: 'Math.sin(x*8 + Math.sin(y*2))' },
            { title: 'Bubble Wrap Domes', eq: 'Math.pow(Math.sin(x*3) * Math.sin(y*3), 2)' },
            { title: 'Smooth Ripple', eq: 'Math.sin(Math.sqrt(x*x + y*y)*3)' }
        ];

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, -60, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(20, -20, 40);
        scene.add(dirLight);

        // Standard PLA/Silk Material
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xd84b7b, roughness: 0.3, metalness: 0.2 
        });

        let currentMesh = null;

        // --- Core Generator ---
        function generateSurface() {
            const errorMsg = document.getElementById('error-msg');
            const format = document.getElementById('format-select').value;
            const eqStr = document.getElementById('equation-input').value;

            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
            }

            try {
                const zFunc = new Function('x', 'y', 'return ' + eqStr + ';');
                zFunc(0,0); // Test to ensure JS logic isn't broken
                errorMsg.style.display = 'none';

                let baseGeo, width, height, marginX, marginY;
                const thickness = 3; 
                const margin = 4; // 4mm smooth border

                // 1. Generate Base Format Geometry
                if (format === 'card') {
                    width = 63; height = 88;
                    baseGeo = new THREE.BoxGeometry(width, height, thickness, 100, 100, 1);
                    marginX = (width/2) - margin; marginY = (height/2) - margin;
                } else if (format === 'coin') {
                    width = 50; height = 50;
                    baseGeo = new THREE.CylinderGeometry(25, 25, thickness, 120, 1);
                    baseGeo.rotateX(Math.PI / 2); // Align Z up
                } else if (format === 'stone') {
                    width = 60; height = 80;
                    baseGeo = new THREE.CylinderGeometry(30, 30, thickness, 120, 1);
                    baseGeo.scale(1, 1, 80/60); // Squash into oval
                    baseGeo.rotateX(Math.PI / 2);
                }

                // 2. Apply Tactile Math to Top Face
                const positions = baseGeo.attributes.position;
                for (let i = 0; i < positions.count; i++) {
                    const x = positions.getX(i);
                    const y = positions.getY(i);
                    const z = positions.getZ(i);

                    // If vertex is on the top face (Z > 0)
                    if (z > 1) {
                        let applyTexture = false;
                        
                        if (format === 'card') {
                            if (Math.abs(x) < marginX && Math.abs(y) < marginY) applyTexture = true;
                        } else if (format === 'coin') {
                            const dist = Math.sqrt(x*x + y*y);
                            if (dist < 25 - margin) applyTexture = true;
                        } else if (format === 'stone') {
                            const nx = x / 30; const ny = y / 40;
                            const dist = Math.sqrt(nx*nx + ny*ny);
                            if (dist < 0.85) applyTexture = true; 
                        }

                        if (applyTexture) {
                            const mathX = (x / (width/2)) * 10;
                            const mathY = (y / (height/2)) * 10;
                            const zVal = zFunc(mathX, mathY);
                            if(!isNaN(zVal)) positions.setZ(i, z + zVal);
                        }
                    }
                }
                baseGeo.computeVertexNormals();

                // 3. Create the mesh
                currentMesh = new THREE.Mesh(baseGeo, material);
                scene.add(currentMesh);

            } catch (e) {
                console.error(e);
                errorMsg.textContent = "Logic Error: " + e.message;
                errorMsg.style.display = 'block';
            }
        }

        // --- Logic Builder & UI ---
        function buildComboEquation() {
            const baseEq = document.getElementById('base-select').value;
            const microEq = document.getElementById('micro-select').value;
            const intensity = document.getElementById('intensity').value;
            const rotation = document.getElementById('rotation').value;

            document.getElementById('intensity-val').textContent = intensity;
            document.getElementById('rotation-val').textContent = rotation + '°';

            const eqStr = `(function(x, y) {
    const th = ${rotation} * Math.PI / 180;
    const rx = x * Math.cos(th) - y * Math.sin(th);
    const ry = x * Math.sin(th) + y * Math.cos(th);
    const base = (x, y) => ${baseEq};
    const micro = (x, y) => ${microEq};
    return base(x, y) + ${intensity} * micro(rx, ry);
})(x, y)`;

            document.getElementById('equation-input').value = eqStr;
            document.getElementById('preset-select').value = ""; // Clear preset selection
            generateSurface();
        }

        function triggerDownload(content, filename) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.style.display = 'none'; link.href = url; link.download = filename;
            document.body.appendChild(link); link.click();
            document.body.removeChild(link); URL.revokeObjectURL(url);
        }

        function initUI() {
            // Populate Equation Library Presets
            const presetSelect = document.getElementById('preset-select');
            equationLibrary.forEach(p => presetSelect.add(new Option(p.title, p.eq)));

            // Populate Combo Builder Dropdowns
            const baseSelect = document.getElementById('base-select');
            basePatterns.forEach(p => baseSelect.add(new Option(p.title, p.eq)));
            
            const microSelect = document.getElementById('micro-select');
            microTextures.forEach(p => microSelect.add(new Option(p.title, p.eq)));

            // Event Listeners: Combo Builder
            baseSelect.addEventListener('change', buildComboEquation);
            microSelect.addEventListener('change', buildComboEquation);
            document.getElementById('intensity').addEventListener('input', buildComboEquation);
            document.getElementById('rotation').addEventListener('input', buildComboEquation);
            
            // Event Listener: Preset Selection
            presetSelect.addEventListener('change', (e) => {
                if(e.target.value) {
                    document.getElementById('equation-input').value = e.target.value;
                    generateSurface();
                }
            });

            // Event Listeners: Format & Export
            document.getElementById('format-select').addEventListener('change', generateSurface);
            document.getElementById('btn-render').addEventListener('click', generateSurface);
            
            document.getElementById('btn-export').addEventListener('click', () => {
                const exporter = new STLExporter();
                const stlString = exporter.parse(scene); 
                const format = document.getElementById('format-select').value;
                triggerDownload(stlString, `TouchySubjects_${format}_Solid.stl`);
            });

            document.getElementById('btn-gacha').addEventListener('click', () => {
                baseSelect.selectedIndex = Math.floor(Math.random() * basePatterns.length);
                microSelect.selectedIndex = Math.floor(Math.random() * microTextures.length);
                document.getElementById('intensity').value = (Math.random() * 2).toFixed(2);
                document.getElementById('rotation').value = Math.floor(Math.random() * 36) * 10;
                buildComboEquation();
            });

            // Initial Build
            baseSelect.selectedIndex = 1; 
            microSelect.selectedIndex = 0;
            buildComboEquation();
        }

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        initUI();
        animate();
    </script>
</body>
</html>
